services:
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.13.0
    user: "0"
    command: ["-config", "/opt/spire/conf/server/server.conf"]
    volumes:
      - ./spire/server:/opt/spire/conf/server:ro

  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.13.0
    user: "0"
    depends_on: [spire-server]
    command: ["-config", "/opt/spire/conf/agent/agent.conf", "-joinToken", "${JOIN_TOKEN:-unset}"]
    volumes:
      - ./spire/agent:/opt/spire/conf/agent:ro
      - spire-sockets:/opt/spire/sockets

  # Policy decision point. --watch reloads policy/data on file change.
  opa:
    image: openpolicyagent/opa:1.9.0-static
    command: ["run", "--server", "--addr", ":8181", "--watch", "--log-level", "error", "/policies"]
    volumes:
      - ./opa/policies:/policies:ro

  # Workloads share the SPIRE agent's PID namespace so the unix attestor can
  # inspect the calling process (UID) behind each Workload API request.

  agent-b:   # "research agent" — the callee
    build: ./agent
    user: "1002"
    pid: "service:spire-agent"
    depends_on: [spire-agent, opa]
    environment:
      MODE: server
      OPA_URL: http://opa:8181
    volumes:
      - spire-sockets:/opt/spire/sockets:ro

  agent-a:   # "orchestrator agent" — granted some tools, not others
    build: ./agent
    user: "1001"
    pid: "service:spire-agent"
    depends_on: [agent-b]
    environment:
      MODE: client
      TARGET_URL: https://agent-b:8443
      TARGET_ID: spiffe://example.org/agent-b
      TOOLS: research,summarize,delete_records
    volumes:
      - spire-sockets:/opt/spire/sockets:ro

  agent-rogue:   # has a valid SVID, but no permissions in OPA
    build: ./agent
    user: "1003"
    pid: "service:spire-agent"
    depends_on: [agent-b]
    environment:
      MODE: client
      TARGET_URL: https://agent-b:8443
      TARGET_ID: spiffe://example.org/agent-b
    volumes:
      - spire-sockets:/opt/spire/sockets:ro

volumes:
  spire-sockets:
