services:
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.13.0
    user: "0"
    command: ["-config", "/opt/spire/conf/server/server.conf"]
    volumes:
      - ./spire/server:/opt/spire/conf/server:ro

  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.13.0
    user: "0"
    depends_on: [spire-server]
    command: ["-config", "/opt/spire/conf/agent/agent.conf", "-joinToken", "${JOIN_TOKEN:-unset}"]
    volumes:
      - ./spire/agent:/opt/spire/conf/agent:ro
      - spire-sockets:/opt/spire/sockets

  # Policy decision point. --watch reloads policy/data on file change.
  opa:
    image: openpolicyagent/opa:1.9.0-static
    command: ["run", "--server", "--addr", ":8181", "--watch", "--log-level", "error", "/policies"]
    volumes:
      - ./opa/policies:/policies:ro

  # Workloads share the SPIRE agent's PID namespace so the unix attestor can
  # inspect the calling process (UID) behind each Workload API request.

  # Issues delegation tokens: "agent X may act for user Y, on target Z, for
  # one tool". Also stands in for the users' identity provider (demo only).
  token-service:
    build: ./agent
    user: "1004"
    pid: "service:spire-agent"
    depends_on: [spire-agent, opa]
    environment:
      MODE: token-service
      OPA_URL: http://opa:8181
      DEMO_USERS: maria,alex
    volumes:
      - spire-sockets:/opt/spire/sockets:ro

  agent-b:   # "research agent" — the callee
    build: ./agent
    user: "1002"
    pid: "service:spire-agent"
    depends_on: [spire-agent, opa, token-service]
    environment:
      MODE: server
      OPA_URL: http://opa:8181
      TOKEN_SERVICE_URL: https://token-service:8443
      TOKEN_SERVICE_ID: spiffe://example.org/token-service
    volumes:
      - spire-sockets:/opt/spire/sockets:ro

  agent-a:   # "orchestrator agent" — acts on behalf of users
    build: ./agent
    user: "1001"
    pid: "service:spire-agent"
    depends_on: [agent-b]
    environment:
      MODE: client
      TARGET_URL: https://agent-b:8443
      TARGET_ID: spiffe://example.org/agent-b
      TOKEN_SERVICE_URL: https://token-service:8443
      TOKEN_SERVICE_ID: spiffe://example.org/token-service
      # user:tool per call; empty user = no delegation token; ~forged = tampered token
      CALLS: maria:research,maria:delete_records,alex:delete_records,:research,maria~forged:summarize
    volumes:
      - spire-sockets:/opt/spire/sockets:ro

  agent-rogue:   # has a valid SVID, but may not act for users
    build: ./agent
    user: "1003"
    pid: "service:spire-agent"
    depends_on: [agent-b]
    environment:
      MODE: client
      TARGET_URL: https://agent-b:8443
      TARGET_ID: spiffe://example.org/agent-b
      TOKEN_SERVICE_URL: https://token-service:8443
      TOKEN_SERVICE_ID: spiffe://example.org/token-service
      CALLS: maria:research
    volumes:
      - spire-sockets:/opt/spire/sockets:ro

volumes:
  spire-sockets:
